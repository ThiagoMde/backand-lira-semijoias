spring.application.name=lira-semijoias
server.port=${PORT:8080}

# URI simplificada para garantir a conexão com o Atlas
spring.data.mongodb.uri=mongodb+srv://user:senha@cluster0.hjjwdgr.mongodb.net/lira?retryWrites=true&w=majority
spring.mongodb.uri=mongodb+srv://user:senha@cluster0.hjjwdgr.mongodb.net/lira?retryWrites=true&w=majority
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:change-this-secret-key-with-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.whatsapp-owner-phone=${WHATSAPP_OWNER_PHONE:5583999999999}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.bootstrap-admin.name=${ADMIN_NAME:Administrador}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB